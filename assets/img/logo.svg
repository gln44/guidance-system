<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guidance Office logo">
  <!-- Seal -->
  <circle cx="32" cy="32" r="31.5" fill="#7B1E2E"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#D9AE45" stroke-width="1.6"/>
  <!-- Small diagonal points of the compass -->
  <g fill="#E9CD85">
    <polygon points="32,32 33.4,26.4 44,20 37.6,30.6"/>
    <polygon points="32,32 30.6,26.4 20,20 26.4,30.6"/>
    <polygon points="32,32 37.6,33.4 44,44 33.4,37.6"/>
    <polygon points="32,32 30.6,37.6 20,44 26.4,33.4"/>
  </g>
  <!-- Main compass points: light and dark halves -->
  <g fill="#F2D37E">
    <polygon points="32,9 36,28 32,32"/>
    <polygon points="55,32 36,36 32,32"/>
    <polygon points="32,55 28,36 32,32"/>
    <polygon points="9,32 28,28 32,32"/>
  </g>
  <g fill="#C4932C">
    <polygon points="32,9 28,28 32,32"/>
    <polygon points="55,32 36,28 32,32"/>
    <polygon points="32,55 36,36 32,32"/>
    <polygon points="9,32 28,36 32,32"/>
  </g>
  <!-- Center -->
  <circle cx="32" cy="32" r="3.6" fill="#7B1E2E" stroke="#F2D37E" stroke-width="1.4"/>
</svg>
